# Local development database for نيو إيرا.
#
# Collation note: the Alpine image is built on musl, which silently ignores libc
# collations other than C — Arabic text would sort by code point. PostgreSQL 17 on
# Alpine ships ICU, so the cluster is initialised with the ICU provider and the
# ar-SA locale. Amazon RDS PostgreSQL 17 supports the same provider through
# `CREATE DATABASE ... LOCALE_PROVIDER icu ICU_LOCALE 'ar-SA'`, so production can
# match. ICU library versions still differ between Alpine and RDS: collation-aware
# indexes must be REINDEXed after a major ICU change. Uniqueness-critical columns
# (email, slug) are ASCII-normalised in the application layer precisely so that
# uniqueness never depends on collation.
services:
  db:
    image: postgres:17-alpine
    container_name: new-era-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newera
      # Local development only. Never used outside this compose file.
      POSTGRES_PASSWORD: newera_local_dev
      POSTGRES_DB: new_era_dev
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=ar-SA --locale=C.UTF-8'
    ports:
      # Non-default host port so a locally installed PostgreSQL does not clash.
      - '5544:5432'
    volumes:
      - new-era-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newera -d new_era_dev']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  new-era-pgdata:
